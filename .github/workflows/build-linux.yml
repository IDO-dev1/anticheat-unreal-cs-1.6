name: Build Linux Metamod SO
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-i386:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build g++-multilib libc6-dev-i386
      - name: Fetch official SDK dependencies
        run: |
          git clone --depth 1 https://github.com/alliedmodders/hlsdk.git deps/hlsdk
          git clone --depth 1 https://github.com/alliedmodders/metamod-hl1.git deps/metamod-hl1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DHLSDK_ROOT=$PWD/deps/hlsdk -DMETAMOD_ROOT=$PWD/deps/metamod-hl1 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test detector core
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          mkdir -p package/cstrike/addons/liveac/dlls
          cp build/live_unreal_scanner_mm_i386.so package/cstrike/addons/liveac/dlls/
          cp config/liveac.cfg package/cstrike/addons/liveac/
          cp docs/INSTALL_HE.md package/
          tar -czf live-unreal-scanner-v0.2.1-linux-i386.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: live-unreal-scanner-v0.2.1-linux-i386
          path: live-unreal-scanner-v0.2.1-linux-i386.tar.gz
